server:
  port: ${SERVER_PORT:18095}

spring:
  application:
    name: payment-processing-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15490}/${DB_NAME:payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16390}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19095}
    consumer:
      group-id: payment-processing-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.marcosperboni.payment.messaging.kafka
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15690}
    username: ${RABBITMQ_USER:payments}
    password: ${RABBITMQ_PASSWORD:payments}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2.0

security:
  jwt:
    secret: ${JWT_SECRET:this-is-a-demo-secret-key-change-it-before-any-real-deployment-01}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

payments:
  gateway-simulator:
    processing-delay-ms: ${GATEWAY_DELAY_MS:500}
    decline-amount-threshold: 13.13

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
